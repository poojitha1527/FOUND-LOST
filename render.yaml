services:
  - type: web
    name: found-lost-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: static
    name: found-lost-frontend
    buildCommand: echo "Static frontend - no build required"
    staticPublishPath: ./frontend